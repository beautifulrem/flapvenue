name: hookguard

# Checks the hook for known Uniswap v4 footguns on every change.
# Heuristic pattern matching, not an audit. Annotates only, never blocks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chaosxcode/hookguard@1fd0ddab626f2578a43ae377cc2a5903d9073a5a # v1
        with:
          paths: contracts
          fail-on: never
